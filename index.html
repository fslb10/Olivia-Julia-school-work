back.bad{background:#fff0eb;color:#984e3c;border-color:#f0c7bd}.feedback strong{display:block;font-size:14px;margin-bottom:2px}.hint-button{border:none;background:none;color:#267e78;font-size:12px;font-weight:850;display:inline-flex;gap:6px;align-items:center;padding:7px 0 0}.hint{font-size:13px;color:#637574;border-left:3px solid #95d9b7;padding:8px 12px;margin:7px 0 0;background:#f3faf4;border-radius:0 9px 9px 0}.section-info{padding:13px 17px;margin:0 0 17px;border-radius:12px;background:#e5f3ef;color:#285a53;font-size:14px;border:1px solid #c6e5da}.section-info.yellow{background:#fff5d9;border-color:#ffe2a1;color:#7a6337}.score-callout{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#e4f6ea;padding:13px 17px;border-radius:13px;margin:20px 0;font-weight:800;color:#28644e}.score-callout strong{font-size:24px}.section-footer{position:relative;margin:18px 0 60px;padding:19px 0;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}.footer-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}.footer-note{font-size:12px;color:var(--muted);flex:1 1 200px}.completion-banner{position:relative;overflow:hidden;text-align:center;padding:43px 30px;background:linear-gradient(125deg,#103d45,#1d7774);color:white;border-radius:28px;margin:18px 0 24px}.completion-banner h1{font-size:clamp(35px,5.2vw,61px);letter-spacing:-.055em;margin:3px 0 12px}.completion-banner p{font-size:16px;color:#dbefdf;margin:0}.grade-circle{width:145px;height:145px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:9px solid #a1dfb1;margin:0 auto 17px;background:#246e68;box-shadow:0 0 0 9px rgba(255,255,255,.08)}.grade-circle b{font-size:39px;line-height:1.15}.grade-circle small{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.result-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.result-card{border:1px solid var(--line);background:white;padding:18px;border-radius:17px}.result-card .emoji{font-size:24px}.result-card strong{display:block;margin-top:10px;font-size:15px}.result-card span{font-size:13px;color:var(--muted)}.result-card .bar{background:#e6eee7;height:7px;border-radius:40px;overflow:hidden;margin-top:11px}.result-card .bar i{display:block;background:#46a991;height:100%;border-radius:40px}.review-panel{background:white;border-radius:20px;padding:23px;border:1px solid var(--line);margin-bottom:55px}.review-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.review-top h2{margin:0;letter-spacing:-.04em}.review-item{padding:15px 0;border-top:1px solid var(--line)}.review-item strong{display:block;font-size:14px;margin-bottom:5px}.review-item p{font-size:13px;color:var(--muted);margin:4px 0}.review-item .answer-line{color:#316756}.review-item .your-answer{color:#995144}.footer{margin:36px 0 20px;text-align:center;color:#79918a;font-size:12px}.hide{display:none!important}

@media(max-width:440px){.hero-actions{flex-direction:column;align-items:stretch}.result-cards{grid-template-columns:1fr}.top-right .label-pill{display:none}.section-footer .btn{flex:1}.footer-actions{width:100%}.section-head h1{font-size:27px}.step-row{gap:5px}.completion-banner{padding:35px 17px}}

<script>
'use strict';
const BANK=[
 {id:'vocab',title:'Science Vocabulary',subtitle:'Choose the best definition for each of these seven important words.',icon:'📚',type:'questions',items:[
  {id:'habitat',type:'choice',question:'What is a habitat?',options:['The natural home or environment of a living thing','A group of organisms that can reproduce','A system for sorting animals into groups','Every living thing found around the world'],answer:0,explanation:'A habitat is where an organism lives and finds what it needs to survive.',hint:'Think about where a frog might find food, water, and shelter.'},
  {id:'community',type:'choice',question:'In science, what is a community?',options:['Only the animals living in one habitat','Different populations of living things together in one area','Every member of one species on Earth','A place where one animal sleeps'],answer:1,explanation:'A community includes populations of different species living and interacting in the same area.',hint:'Think about trees, birds, insects, and fungi in the same forest.'},
  {id:'species',type:'choice',question:'Which description best explains a species?',options:['Any living things that share the same habitat','All the living organisms in a forest','A group of similar organisms that can usually reproduce with each other','A group containing plants, fungi, and animals'],answer:2,explanation:'A species is a group of similar organisms that can usually reproduce with one another.',hint:'Scientists use this term to group organisms that are very closely related.'},
  {id:'organism',type:'choice',question:'What is an organism?',options:['A living thing made of many cells only','An individual living thing, made of one or more cells','A nonliving object in an ecosystem','A home shared by many species'],answer:1,explanation:'An organism is one living thing. It may be single-celled or made of many cells.',hint:'A bacterium and a whale are both examples.'},
  {id:'biodiversity',type:'choice',question:'What does biodiversity mean?',options:['The number of mammals in a city','The number of habitats on Earth','The variety of living things in an area','The way a food chain transfers energy'],answer:2,explanation:'Biodiversity is the variety of life, including different species, within an area.',hint:'A forest with many different plants and animals has a lot of this.'},
  {id:'gradient',type:'choice',question:'What is the latitudinal biodiversity gradient?',options:['The pattern of greater biodiversity near the equator than near the poles','A method used to classify plants by their leaves','The increase in animal size toward the equator','The movement of species between habitats each season'],answer:0,explanation:'In general, biodiversity is highest around the equator and tends to decrease toward the poles.',hint:'Compare tropical rainforests with icy polar regions.'},
  {id:'classification',type:'choice',question:'What is a classification system?',options:['A chart showing how plants get sunlight','A way to organize living things by shared characteristics','A list of all animals in one habitat','A method of measuring an animal’s weight'],answer:1,explanation:'Classification helps scientists organize living things into groups using shared features.',hint:'Think about sorting a collection into related groups.'}
 ]},
 {id:'names',title:'Name the Five Kingdoms',subtitle:'No word bank this time! Type all five kingdoms from memory. Order does not matter.',icon:'✏️',type:'kingdoms',items:Array.from({length:5},(_,i)=>({id:'name'+(i+1),type:'kingdom',question:'Kingdom '+(i+1),hint:'Think of bacteria, one-celled eukaryotes, decomposers, photosynthesizers, and consumers.'}))},
 {id:'traits',title:'Kingdom Characteristics',subtitle:'Each card gives THREE clues. Match it to the correct kingdom.',icon:'🍄',type:'matching',options:['Animals','Plants','Fungi','Protists','Monera'],items:[
  {id:'traits-monera',question:'Single-celled • Cells have no nucleus • Includes bacteria',answer:'Monera',explanation:'Monerans are single-celled organisms without a nucleus; bacteria belong in this older five-kingdom group.'},
  {id:'traits-plants',question:'Made of many cells • Usually make food using sunlight • Have cell walls',answer:'Plants',explanation:'Plants are multicellular, usually photosynthesize, and have cell walls.'},
  {id:'traits-protists',question:'Mostly single-celled • Cells have a nucleus • Includes amoebas and paramecia',answer:'Protists',explanation:'Protists have cells with nuclei; many are single-celled, such as amoebas and paramecia.'},
  {id:'traits-animals',question:'Made of many cells • Eat other organisms for energy • Cells have no cell walls',answer:'Animals',explanation:'Animals are multicellular consumers whose cells do not have cell walls.'},
  {id:'traits-fungi',question:'Often made of many cells • Absorb nutrients from their surroundings • Include mushrooms and moulds',answer:'Fungi',explanation:'Fungi absorb nutrients instead of making food by photosynthesis; some, such as yeast, are single-celled.'}
 ]},
 {id:'vertebrates',title:'Vertebrate Match-Up',subtitle:'All vertebrates have backbones. Match each pair of clues to its group.',icon:'🐸',type:'matching',options:['Birds','Amphibians','Mammals','Fish','Reptiles'],items:[
  {id:'v-fish',question:'Usually cold-blooded • Breathe with gills',answer:'Fish',explanation:'Fish are generally cold-blooded vertebrates that use gills to breathe.'},
  {id:'v-mammals',question:'Warm-blooded • Have hair or fur',answer:'Mammals',explanation:'Mammals control their body temperature internally and have hair or fur at some stage.'},
  {id:'v-reptiles',question:'Cold-blooded • Have dry, scaly skin',answer:'Reptiles',explanation:'Reptiles depend largely on outside heat to warm up, and their skin has dry scales.'},
  {id:'v-birds',question:'Warm-blooded • Have feathers',answer:'Birds',explanation:'All birds have feathers, and birds are warm-blooded.'},
  {id:'v-amphibians',question:'Cold-blooded • Usually have moist skin',answer:'Amphibians',explanation:'Amphibians, such as frogs, typically have moist skin and often begin life in water.'}
 ]},
 {id:'invertebrates',title:'Invertebrate Match-Up',subtitle:'Match the group using its description and TWO examples.',icon:'🦋',type:'matching',options:['Arthropods','Worms','Mollusks','Insects','Crustaceans'],items:[
  {id:'i-insects',question:'Six legs and three main body sections',examples:'Examples: ants and butterflies',answer:'Insects',explanation:'Insects have six legs and three main body sections; insects are also arthropods.'},
  {id:'i-mollusks',question:'Soft bodies, often protected by a shell',examples:'Examples: snails and clams',answer:'Mollusks',explanation:'Mollusks are soft-bodied invertebrates, and many have shells.'},
  {id:'i-arthropods',question:'Jointed legs and a hard outer skeleton',examples:'Examples: spiders and centipedes',answer:'Arthropods',explanation:'Arthropods have jointed limbs and exoskeletons. Insects and crustaceans also belong to this larger group.'},
  {id:'i-worms',question:'Long, soft bodies without legs',examples:'Examples: earthworms and leeches',answer:'Worms',explanation:'Earthworms and leeches are worm-like invertebrates without legs.'},
  {id:'i-crustaceans',question:'Hard outer covering; many live in water',examples:'Examples: crabs and lobsters',answer:'Crustaceans',explanation:'Crustaceans, including crabs and lobsters, are arthropods with an exoskeleton.'}
 ]},
 {id:'challenge',title:'Final Challenge',subtitle:'Mix it up! Answer multiple choice, true or false, and fill-in-the-blank questions.',icon:'🏆',type:'questions',items:[
  {id:'c1',type:'choice',question:'What is the main difference between vertebrates and invertebrates?',options:['Vertebrates are always bigger','Vertebrates have backbones','Invertebrates are always insects','Invertebrates cannot move'],answer:1,explanation:'Vertebrates have a backbone. Invertebrates do not.',hint:'Think about the structure supporting the body.'},
  {id:'c2',type:'choice',question:'Which of these animals is an invertebrate?',options:['Salmon','Eagle','Frog','Snail'],answer:3,explanation:'A snail has no backbone, so it is an invertebrate.',hint:'Which one has no backbone?'},
  {id:'c3',type:'choice',question:'Which pair of features best describes arthropods?',options:['Feathers and warm blood','Jointed legs and an exoskeleton','Moist skin and a backbone','Hair and internal body heat'],answer:1,explanation:'Arthropods have jointed appendages and a tough outer skeleton called an exoskeleton.',hint:'Think about a spider’s legs and outer body covering.'},
  {id:'c4',type:'choice',question:'Which place would generally have the MOST biodiversity?',options:['Tropical rainforest near the equator','Tundra near the North Pole','An icy Antarctic landscape','High Arctic sea ice'],answer:0,explanation:'Tropical areas near the equator generally have greater biodiversity than polar regions.',hint:'Remember the latitudinal biodiversity gradient.'},
  {id:'c5',type:'choice',question:'Crabs and lobsters belong to which invertebrate group?',options:['Mollusks','Worms','Crustaceans','Amphibians'],answer:2,explanation:'Crabs and lobsters are crustaceans, which are also part of the arthropod group.',hint:'Think of the group known for a protective outer shell.'},
  {id:'t1',type:'tf',question:'Every organism is made of only one cell.',answer:'false',explanation:'Some organisms, like bacteria, are single-celled. Others, like animals and plants, are multicellular.'},
  {id:'t2',type:'tf',question:'Insects are a type of arthropod.',answer:'true',explanation:'Insects belong to the larger arthropod group because they have jointed legs and an exoskeleton.'},
  {id:'t3',type:'tf',question:'All arthropods have eight legs.',answer:'false',explanation:'Leg counts vary. Insects have six legs, spiders have eight, and centipedes have many.'},
  {id:'t4',type:'tf',question:'Many amphibians begin life in water.',answer:'true',explanation:'Many amphibians, such as frogs, begin as aquatic young before changing as they grow.'},
  {id:'t5',type:'tf',question:'Reptiles are warm-blooded, just like mammals.',answer:'false',explanation:'Reptiles are generally cold-blooded (ectothermic); mammals are warm-blooded.'},
  {id:'f1',type:'fill',question:'Animals with backbones are called ________.',accept:['vertebrates','vertebrate'],solution:'vertebrates',explanation:'Vertebrates are animals that have backbones.',hint:'This word begins with V.'},
  {id:'f2',type:'fill',question:'A hard outer skeleton on an arthropod is called an ________.',accept:['exoskeleton','exo skeleton','exo-skeleton'],solution:'exoskeleton',explanation:'An exoskeleton protects and supports an arthropod’s body.',hint:'The word begins with a prefix meaning “outside.”'},
  {id:'f3',type:'fill',question:'The moving connections on an arthropod’s legs are called ________.',accept:['joints','joint'],solution:'joints',explanation:'Arthropods have jointed legs, meaning they bend at joints.',hint:'Think of your elbow or knee.'},
  {id:'f4',type:'fill',question:'Animals without backbones are called ________.',accept:['invertebrates','invertebrate'],solution:'invertebrates',explanation:'Invertebrates are animals that do not have backbones.',hint:'This is the opposite of vertebrates.'},
  {id:'f5',type:'fill',question:'Biodiversity is generally highest near the ________.',accept:['equator','earths equator','the equator'],solution:'equator',explanation:'Warm tropical regions near the equator generally have especially high biodiversity.',hint:'Think of the imaginary line around Earth’s middle.'}
 ]}
];
const KINGDOMS=['Monera','Protists','Fungi','Plants','Animals'];
const ALIASES={monera:['monera','moneran','monerans','moneran kingdom'],protists:['protists','protist','protista','protist kingdom'],fungi:['fungi','fungus','fungi kingdom','fungus kingdom'],plants:['plants','plant','plantae','plant kingdom'],animals:['animals','animal','animalia','animal kingdom']};
const VERSION='biodiversity-explorer-2026-v1';
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const normalize=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
const canonical=s=>{let v=normalize(s);for(let [k,forms] of Object.entries(ALIASES)){if(forms.map(normalize).includes(v))return KINGDOMS.find(n=>normalize(n)===k)}return null};
const clone=x=>JSON.parse(JSON.stringify(x));
const fresh=mode=>({started:true,mode,step:0,answers:{},checked:{},finished:false,filter:'missed',hints:{}});
let state=load()||{started:false,mode:'practice',step:0,answers:{},checked:{},finished:false,filter:'missed',hints:{}};
function load(){try{const data=JSON.parse(localStorage.getItem(VERSION));if(!data||typeof data!=='object'||!data.started)return null;return {...fresh(data.mode==='test'?'test':'practice'),...data,step:Math.max(0,Math.min(5,Number(data.step)||0))}}catch{return null}}
function save(){try{localStorage.setItem(VERSION,JSON.stringify(state))}catch{}}
function key(section,item){return section.id+':'+item.id}
function entry(section,item){return String(state.answers[key(section,item)]??'')}
function evaluate(section,item){const response=entry(section,item),trim=response.trim();if(item.type==='kingdom'){const k=canonical(response);const earlier=section.items.slice(0,section.items.indexOf(item)).some(q=>canonical(entry(section,q))===k&&k);return{correct:!!k&&!earlier,answer:trim||'(blank)',expected:'Five unique kingdoms: Monera, Protists, Fungi, Plants, Animals',why:!trim?'Write one kingdom.':!k?'That is not one of the five kingdoms.':earlier?'You already listed that kingdom.':'One kingdom named correctly.'}}if(item.type==='fill')return{correct:(item.accept||[]).some(v=>normalize(v)===normalize(response)),answer:trim||'(blank)',expected:item.solution,why:item.explanation};if(section.type==='matching')return{correct:response===item.answer,answer:response||'(not matched)',expected:item.answer,why:item.explanation};if(item.type==='tf')return{correct:response===item.answer,answer:response?response==='true'?'True':'False':'(not answered)',expected:item.answer==='true'?'True':'False',why:item.explanation};return{correct:response===String(item.answer),answer:trim?item.options[Number(response)]:'(not answered)',expected:item.options[Number(item.answer)],why:item.explanation}}
function totalItems(){return BANK.reduce((n,s)=>n+s.items.length,0)}
function answered(){return BANK.reduce((n,s)=>n+s.items.filter(q=>entry(s,q).trim()!=='').length,0)}
function getScore(section){return section.items.reduce((n,q)=>n+(evaluate(section,q).correct?1:0),0)}
function getTotal(){return BANK.reduce((n,s)=>n+getScore(s),0)}
function header(){return `<header class="topbar"><div class="brand"><span class="logo" aria-hidden="true">✳</span><span>WILD<span style="color:#2d9a86">WISE</span></span></div><div class="top-right"><span class="label-pill">🌿 GRADE 6 SCIENCE</span>${state.started&&!state.finished?`<button class="btn btn-outline btn-small" data-action="home">↗ Home</button>`:''}</div></header>`}
function art(){return `<div class="hero-art" aria-hidden="true"><div class="orb"><svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M91 155C90 118 85 84 65 45" stroke="#D6F5B4" stroke-width="9" stroke-linecap="round"/><path d="M79 95C39 97 24 76 25 48C58 44 82 57 79 95Z" fill="#C0EE9D"/><path d="M88 77C96 34 129 27 146 38C142 67 122 91 88 77Z" fill="#E7F4B6"/><path d="M93 126C129 97 154 115 155 135C130 153 108 152 93 126Z" fill="#B1E194"/><path d="M45 56C59 65 65 77 73 87M111 65C119 53 130 48 138 43M117 128L146 132" stroke="#5A9C7B" stroke-width="4" stroke-linecap="round"/><circle cx="57" cy="146" r="7" fill="#FFE6A0"/><circle cx="132" cy="101" r="5" fill="#FFD16E"/></svg></div><span class="sticker one">🦋</span><span class="sticker two">🐸</span><span class="sticker three">🍄</span></div>`}
function welcome(){const saved=state.started;return `<div class="shell">${header()}<section class="hero"><div><span class="eyebrow">✦ THE SCIENCE ADVENTURE</span><h1>Big world.<br><span class="accent">Little explorer.</span></h1><p>Explore biodiversity, discover the five kingdoms, and test your animal knowledge. Learn, practise, and level up!</p><div class="hero-actions"><button class="btn btn-primary" data-action="start" data-mode="practice">🌱 Start Practice</button><button class="btn btn-light" data-action="start" data-mode="test">🎯 Test Yourself</button>${saved?`<button class="btn btn-outline" data-action="resume">↗ Resume saved quiz</button>`:''}</div></div>${art()}</section><div class="welcome-bottom"><article class="mini-card"><div class="mini-icon">🔍</div><h3>6 learning missions</h3><p>Vocabulary, kingdoms, vertebrates, invertebrates, and a final challenge.</p></article><article class="mini-card"><div class="mini-icon">⭐</div><h3>${totalItems()} points to earn</h3><p>All questions are worth one point. You will see your score and corrections.</p></article><article class="mini-card"><div class="mini-icon">💡</div><h3>Choose your style</h3><p>Practice shows feedback after each mission. Test mode scores you at the end.</p></article></div><p class="tip-strip"><strong>Science note:</strong> This review uses the traditional <strong>five-kingdom</strong> model from your worksheet. Scientists also use more modern ways to classify life. Your answers stay on this lesson’s model.</p>${footer()}</div>`}
function footer(){return `<footer class="footer">Made for curious minds · Your answers stay in this browser · No account needed</footer>`}
function renderQuestion(s,q,i,show){let id=key(s,q),response=entry(s,q),e=show?evaluate(s,q):null;let body='';if(q.type==='choice'||q.type==='tf'){const opts=q.type==='tf'?['True','False']:q.options;body=`<div class="option-grid" role="group" aria-label="Answer choices">${opts.map((opt,j)=>{const val=q.type==='tf'?(j===0?'true':'false'):String(j);return `<button type="button" class="answer-option ${response===val?(show&&!e.correct?'chosen-wrong':'chosen'):''}" data-answer="${esc(id)}" data-value="${esc(val)}" aria-pressed="${response===val}" ${show?'disabled':''}><span class="choice-letter">${q.type==='tf'?(j===0?'T':'F'):String.fromCharCode(65+j)}</span><span class="choice-label">${esc(opt)}</span></button>`}).join('')}</div>`}else{body=`<input class="field" type="text" data-entry="${esc(id)}" aria-label="Answer for question ${i+1}" placeholder="Type your answer..." value="${esc(response)}" autocomplete="off" spellcheck="false" ${show?'disabled':''}>`}
return `<article class="q-card ${show?(e.correct?'is-correct':'is-wrong'):''}"><div class="q-num">QUESTION ${i+1} · 1 POINT</div><p class="q-title">${esc(q.question)}</p>${body}${show?feedback(e):(!state.hints[id]&&q.hint?`<button class="hint-button" data-hint="${esc(id)}">💡 Need a hint?</button>`:'')}${!show&&state.hints[id]&&q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}</article>`}
function feedback(result){return `<div class="feedback ${result.correct?'':'bad'}" role="status"><strong>${result.correct?'✓ Nicely done!':'↗ Keep learning!'}</strong>${result.correct?'':`<div><b>Correct answer:</b> ${esc(result.expected)}</div>`}<div>${esc(result.why)}</div></div>`}
function renderKingdom(s,q,i,show){const e=show?evaluate(s,q):null;return `<article class="q-card ${show?(e.correct?'is-correct':'is-wrong'):''}"><div class="q-num">KINGDOM ${i+1} · 1 POINT</div><label class="q-title" for="${esc(key(s,q))}">Write a kingdom name:</label><input class="field" id="${esc(key(s,q))}" type="text" data-entry="${esc(key(s,q))}" value="${esc(entry(s,q))}" placeholder="Kingdom ${i+1}..." autocomplete="off" spellcheck="false" ${show?'disabled':''}>${show?feedback(e):''}</article>`}
function renderMatch(s,q,i,show){const e=show?evaluate(s,q):null;return `<article class="q-card ${show?(e.correct?'is-correct':'is-wrong'):''}"><div class="q-num">MATCH ${i+1} · 1 POINT</div><div class="match-row"><div class="match-text"><strong>${esc(q.question)}</strong>${q.examples?`<span class="examples">${esc(q.examples)}</span>`:''}</div><select class="field" data-entry="${esc(key(s,q))}" aria-label="Choose group for match ${i+1}" ${show?'disabled':''}><option value="">Choose a group…</option>${s.options.map(o=>`<option value="${esc(o)}" ${entry(s,q)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${show?feedback(e):''}</article>`}
function stage(){const s=BANK[state.step],done=!!state.checked[s.id]&&state.mode==='practice',count=answered(),pct=Math.round(count/totalItems()*100);return `<div class="shell">${header()}<div class="header-line"><span class="label-pill">${state.mode==='practice'?'🌱 PRACTICE MODE':'🎯 TEST MODE'}</span><span class="progress-meta">${count} / ${totalItems()} answered · ${pct}%</span></div><div class="progress-track" aria-label="Overall answer progress"><div class="progress-fill" style="width:${pct}%"></div></div><nav class="step-row" aria-label="Quiz sections">${BANK.map((q,i)=>`<div class="step ${i===state.step?'active':i<state.step||state.checked[q.id]?'done':''}" aria-current="${i===state.step?'step':'false'}"><span class="step-num">${i+1}</span><span>${['Words','Kingdoms','Traits','Vertebrates','Invertebrates','Final'][i]}</span></div>`).join('')}</nav><div class="section-head"><div><span class="eyebrow">MISSION ${state.step+1} OF 6</span><h1>${esc(s.title)}</h1><p>${esc(s.subtitle)}</p></div><div class="section-icon" aria-hidden="true">${s.icon}</div></div>${s.id==='invertebrates'?`<aside class="section-info yellow"><strong>Helpful fact:</strong> Insects and crustaceans are both kinds of arthropods. For matching, choose the <em>most specific</em> group named by the clue; the arthropod card uses spiders and centipedes.</aside>`:''}${s.id==='traits'?`<aside class="section-info">The three clues belong together. Use all three to identify the kingdom, not just one clue.</aside>`:''}${s.id==='names'?`<aside class="section-info">There are five unique answers. You can write them in any order, but don’t repeat a kingdom.</aside>`:''}<div class="question-stack">${s.items.map((q,i)=>s.type==='kingdoms'?renderKingdom(s,q,i,done):s.type==='matching'?renderMatch(s,q,i,done):renderQuestion(s,q,i,done)).join('')}</div>${done?`<div class="score-callout"><span>Mission score</span><strong>${getScore(s)} / ${s.items.length}</strong></div>`:''}<div class="section-footer">${state.step>0?`<button class="btn btn-outline" data-action="previous">← Previous</button>`:'<span class="footer-note">You can change an answer until you check the mission.</span>'}<div class="footer-actions">${state.mode==='practice'&&!done?`<button class="btn btn-primary" data-action="check">Check this mission ✓</button>`:state.mode==='practice'?`<button class="btn btn-soft" data-action="redo">Try this mission again</button><button class="btn btn-primary" data-action="next">${state.step===5?'See my results 🏆':'Next mission →'}</button>`:state.step===5?`<button class="btn btn-primary" data-action="finish">Finish & see score 🏆</button>`:`<button class="btn btn-primary" data-action="next">Next mission →</button>`}</div></div>${footer()}</div>`}
function results(){let score=getTotal(),total=totalItems(),percent=Math.round(score/total*100),message=percent===100?'Perfect explorer!':percent>=85?'Amazing exploring!':percent>=70?'Great progress!':percent>=50?'Keep discovering!':'Every expert starts somewhere!';const errors=BANK.flatMap(s=>s.items.map(q=>({s,q,e:evaluate(s,q)})).filter(x=>!x.e.correct));const shown=state.filter==='all'?BANK.flatMap(s=>s.items.map(q=>({s,q,e:evaluate(s,q)}))):errors;return `<div class="shell">${header()}<div class="completion-banner"><div class="grade-circle"><b>${percent}%</b><small>${score} / ${total}</small></div><span class="eyebrow">✦ MISSION COMPLETE</span><h1>${message}</h1><p>You completed the Grade 6 Biodiversity Explorer review.</p><div class="hero-actions" style="justify-content:center"><button class="btn btn-primary" data-action="restart">↻ Play again</button><button class="btn btn-light" data-action="print">🖨 Print results</button></div></div><div class="section-head"><div><span class="eyebrow">YOUR FIELD REPORT</span><h1>Mission breakdown</h1><p>Every item is worth one point. Use your corrections to study before the test.</p></div><div class="section-icon">📊</div></div><section class="result-cards">${BANK.map(s=>{const n=getScore(s),p=Math.round(n/s.items.length*100);return `<article class="result-card"><div class="emoji">${s.icon}</div><strong>${esc(s.title)}</strong><span>${n} out of ${s.items.length} correct</span><div class="bar"><i style="width:${p}%"></i></div></article>`}).join('')}</section><section class="review-panel"><div class="review-top"><div><span class="eyebrow">LEARN FROM YOUR ANSWERS</span><h2>${state.filter==='all'?'All answers':'Questions to revisit'} (${shown.length})</h2></div><button class="btn btn-soft btn-small" data-action="filter">${state.filter==='all'?'Show missed only':'Show all answers'}</button></div>${shown.length?shown.map(({s,q,e})=>`<div class="review-item"><span class="eyebrow">${esc(s.title)}</span><strong>${esc(q.question)}</strong>${q.examples?`<p>${esc(q.examples)}</p>`:''}<p class="your-answer">Your answer: ${esc(e.answer)}</p><p class="answer-line">${q.type==='kingdom'?'Kingdoms to remember':'Correct answer'}: ${esc(e.expected)}</p><p>${esc(e.why)}</p></div>`).join(''):'<div class="section-info">🎉 No mistakes! Excellent work. Try Test Mode next to practise without hints.</div>'}</section>${footer()}</div>`}
function render(){document.title='Biodiversity Explorer | Grade 6 Science';$('#app').innerHTML=state.finished?results():state.started&&!state.viewHome?stage():welcome();updateAnswerProgress()}
function updateAnswerProgress(){const el=$('.progress-meta'),fill=$('.progress-fill');if(el){let count=answered(),p=Math.round(count/totalItems()*100);el.textContent=`${count} / ${totalItems()} answered · ${p}%`;fill.style.width=p+'%'}}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function handleAction(button){const action=button.dataset.action;if(action==='start'){state=fresh(button.dataset.mode==='test'?'test':'practice');save();render();scrollTop()}else if(action==='resume'){state.viewHome=false;save();render();scrollTop()}else if(action==='home'){state.viewHome=true;save();render();scrollTop()}else if(action==='previous'){state.step=Math.max(0,state.step-1);save();render();scrollTop()}else if(action==='next'){if(state.step===BANK.length-1){state.finished=true}else{state.step++}save();render();scrollTop()}else if(action==='check'){state.checked[BANK[state.step].id]=true;save();render();const wrong=$('.q-card.is-wrong');if(wrong)wrong.scrollIntoView({behavior:'smooth',block:'center'})}else if(action==='redo'){const s=BANK[state.step];for(let q of s.items){delete state.answers[key(s,q)]}delete state.checked[s.id];save();render();scrollTop()}else if(action==='finish'){state.finished=true;save();render();scrollTop()}else if(action==='restart'){if(window.confirm('Start a new quiz? This will replace your saved answers.')){state={started:false,mode:'practice',step:0,answers:{},checked:{},finished:false,filter:'missed',hints:{}};save();render();scrollTop()}}else if(action==='filter'){state.filter=state.filter==='all'?'missed':'all';save();render();$('.review-panel')?.scrollIntoView({behavior:'smooth',block:'start'})}else if(action==='print'){window.print()}}
$('#app').addEventListener('click',evt=>{const action=evt.target.closest('[data-action]');if(action){handleAction(action);return}const answer=evt.target.closest('[data-answer]');if(answer){const k=answer.dataset.answer;state.answers[k]=answer.dataset.value;save();render();return}const hint=evt.target.closest('[data-hint]');if(hint){state.hints[hint.dataset.hint]=true;save();render();return}});
$('#app').addEventListener('input',evt=>{const field=evt.target.closest('input[data-entry]');if(field){state.answers[field.dataset.entry]=field.value;save();updateAnswerProgress()}});
$('#app').addEventListener('change',evt=>{const select=evt.target.closest('select[data-entry]');if(select){state.answers[select.dataset.entry]=select.value;save();updateAnswerProgress()}});
render();
</script>
